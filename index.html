<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo2855</title>
    <style>
        body { 
            background-color: transparent; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Kırmızı Buton */
        .play-btn {
            background: #ff0000;
            color: white;
            border: none;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            font-size: 35px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.6);
            z-index: 100; /* Butonu en öne çıkar */
            position: relative;
        }

        /* Caster.fm Çalarını GİZLE */
        #hiddenPlayer {
            position: absolute;
            width: 1px;  /* Boyutunu 1 piksele düşür */
            height: 1px; 
            opacity: 0;  /* Tamamen görünmez yap */
            pointer-events: none; /* Tıklamaları engellemesin */
            z-index: -1; /* Arkaya at */
        }
    </style>
</head>
<body>
    <!-- Gizli Caster.fm Çaları -->
    <div id="hiddenPlayer">
        <iframe src="https://www.caster.fm/widgets/player?token=335ce5af-29c4-43b6-a23f-3273782554b3" width="100%" height="100%" frameborder="0" allow="autoplay"></iframe>
    </div>

    <!-- Senin Kırmızı Butonun -->
    <button id="playPauseBtn" class="play-btn">▶</button>

    <script>
        const btn = document.getElementById('playPauseBtn');
        const iframe = document.querySelector('#hiddenPlayer iframe');
        let isPlaying = false;

        btn.addEventListener('click', () => {
            // iframe'in içindeki play butonuna tıkla
            if (iframe) {
                const innerDoc = iframe.contentDocument || iframe.contentWindow.document;
                // Caster.fm'in kendi play butonunu bul (genelde id'si veya class'ı vardır)
                const playBtn = innerDoc.querySelector('button') || innerDoc.querySelector('.play-button'); 
                
                if (playBtn) {
                    playBtn.click();
                    isPlaying = !isPlaying;
                    btn.textContent = isPlaying ? '⏸' : '▶';
                    btn.style.background = isPlaying ? '#00ff00' : '#ff0000';
                } else {
                    // Eğer butonu bulamazsa iframe'e odaklanıp Enter'a basmayı dene
                    iframe.contentWindow.focus();
                    iframe.contentWindow.document.body.dispatchEvent(new KeyboardEvent('keydown', {'key': 'Enter'}));
                    isPlaying = !isPlaying;
                    btn.textContent = isPlaying ? '⏸' : '▶';
                    btn.style.background = isPlaying ? '#00ff00' : '#ff0000';
                }
            }
        });
    </script>
</body>
</html>
