<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo2855</title>
    <style>
        body { 
            background-color: transparent; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Caster.fm çalarını şık bir kutu içine alıyoruz */
        .cstrEmbed {
            width: 90%;
            max-width: 320px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.8) !important; /* Koyu yarı şeffaf */
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* İçindeki gri/beyaz kutuları zorla şeffaf yap */
        .cstrEmbed iframe, .cstrEmbed div {
            background-color: transparent !important;
            border: none !important;
        }
    </style>
</head>
<body>
    <!-- Caster.fm Çaları (Senin Tokenin) -->
    <div data-type="newStreamPlayer" 
         data-publicToken="335ce5af-29c4-43b6-a23f-3273782554b3" 
         data-theme="dark" 
         data-color="e81e4d" 
         data-channelId="" 
         data-rendered="false" 
         class="cstrEmbed">

        <a href="https://www.caster.fm">Stream Hosting</a>

</body>
