<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo2855</title>
    <style>
        body { 
            background-color: transparent; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        /* Kendi şık kontrol panelimiz */
        .custom-player {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }

        .play-btn {
            background: #ff0000;
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }

        .play-btn.playing {
            background: #00ff00; /* Çalarken yeşil olsun */
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.4);
        }

        /* Gizli Caster.fm çaları (arka planda çalacak) */
        #hiddenPlayer {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Gizli Caster.fm Çaları -->
    <div id="hiddenPlayer">
        <div data-type="newStreamPlayer" 
             data-publicToken="335ce5af-29c4-43b6-a23f-3273782554b3" 
             data-theme="dark" 
             data-color="e81e4d" 
             data-channelId="" 
             data-rendered="false" 
             class="cstrEmbed">
        </div>
        <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
    </div>

    <!-- Senin Göreceğin Şık Buton -->
    <div class="custom-player">
        <button id="playPauseBtn" class="play-btn">▶</button>
    </div>

    <script>
        const btn = document.getElementById('playPauseBtn');
        let isPlaying = false;

        // Butona basıldığında gizli Caster.fm çalarını tetikle
        btn.addEventListener('click', () => {
            // Caster.fm'in gizli iframe'ini bul
            const iframe = document.querySelector('#hiddenPlayer iframe');
            
            if (iframe) {
                // Caster.fm çalarının içindeki play butonuna bas (otomatik tıklama)
                const innerDoc = iframe.contentDocument || iframe.contentWindow.document;
                const playBtn = innerDoc.querySelector('button'); // Çaların içindeki buton
                
                if (playBtn) {
                    playBtn.click();
                    isPlaying = !isPlaying;
                    
                    if (isPlaying) {
                        btn.textContent = '⏸';
                        btn.classList.add('playing');
                    } else {
                        btn.textContent = '▶';
                        btn.classList.remove('playing');
                    }
                }
            } else {
                alert("Lütfen biraz bekleyin, yayın yükleniyor...");
            }
        });
    </script>
</body>
</html>
