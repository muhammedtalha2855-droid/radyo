<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo2855</title>
    <style>
        body { 
            background-color: transparent; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Caster.fm çalarının dış kutusu */
        .player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Caster.fm'in o gri kutusunu kesip atıyoruz */
        .cstrEmbed {
            width: 320px !important;
            height: 90px !important; /* Sadece alt kısmı (butonların olduğu yeri) göster */
            overflow: hidden !important;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.6) !important; /* Koyu şeffaf arka plan */
            backdrop-filter: blur(10px);
        }

        /* Eğer Caster.fm iframe kullanıyorsa onu da ayarla */
        .cstrEmbed iframe {
            margin-top: -80px; /* Üstteki gri/beyaz kısmı yukarı kaydırıp gizle */
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <!-- Caster.fm Çaları (Senin Tokenin) -->
        <div data-type="newStreamPlayer" 
             data-publicToken="335ce5af-29c4-43b6-a23f-3273782554b3" 
             data-theme="dark" 
             data-color="e81e4d" 
             data-channelId="" 
             data-rendered="false" 
             class="cstrEmbed">
            <a href="https://www.caster.fm">Shoutcast Hosting</a> 
            <a href="https://www.caster.fm">Stream Hosting</a> 
            <a href="https://www.caster.fm">Radio Server Hosting</a>
        </div>
        <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
    </div>
</body>
</html>
