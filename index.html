<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo2855</title>
    <style>
        body { 
            background-color: transparent; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Senin Kırmızı Butonun */
        .play-btn {
            background: #ff0000;
            color: white;
            border: none;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.8);
            z-index: 10;
            position: relative;
            transition: all 0.3s ease;
        }

        .play-btn.playing {
            background: #00ff00;
            box-shadow: 0 5px 20px rgba(0, 255, 0, 0.8);
        }

        /* Caster.fm Çalarını Tamamen Gizle (ama arka planda çalışsın) */
        #hiddenPlayer {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0; /* Tamamen görünmez */
            pointer-events: none; /* Tıklamaları engellemesin */
            z-index: -1;
        }
    </style>
</head>
<body>
    <!-- Gizli Caster.fm Çaları -->
    <div id="hiddenPlayer">
        <div data-type="newStreamPlayer" 
             data-publicToken="335ce5af-29c4-43b6-a23f-3273782554b3" 
             data-theme="dark" 
             data-color="e81e4d" 
             data-channelId="" 
             data-rendered="false" 
             class="cstrEmbed">
        </div>
        <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
    </div>

    <!-- Senin Kırmızı Butonun -->
    <button id="playPauseBtn" class="play-btn">▶</button>

    <script>
        const btn = document.getElementById('playPauseBtn');
        const hiddenPlayer = document.getElementById('hiddenPlayer');
        let isPlaying = false;

        btn.addEventListener('click', () => {
            // Butona tıklandığında gizli iframe'in üzerine tıklama simülasyonu yap
            const iframe = hiddenPlayer.querySelector('iframe');
            
            if (iframe) {
                // Iframe'in merkezine bir tıklama gönder (Caster.fm'in play butonu genelde merkezdedir)
                const rect = iframe.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                
                // Görünmez alana tıklama olayı gönder
                const clickEvent = new MouseEvent('click', {
                    clientX: x,
                    clientY: y,
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                
                // Önce iframe'e odaklan, sonra tıkla
                iframe.contentWindow.focus();
                iframe.contentWindow.document.elementFromPoint(x, y).dispatchEvent(clickEvent);
                
                // Buton görünümünü değiştir
                isPlaying = !isPlaying;
                if (isPlaying) {
                    btn.textContent = '⏸';
                    btn.classList.add('playing');
                } else {
                    btn.textContent = '▶';
                    btn.classList.remove('playing');
                }
            } else {
                alert("Yayın yükleniyor, lütfen 2 saniye sonra tekrar deneyin.");
            }
        });
    </script>
</body>
</html>
