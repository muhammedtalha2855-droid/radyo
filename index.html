<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo2855</title>
    <style>
        body { 
            background-color: transparent; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .play-btn {
            background: #ff0000;
            color: white;
            border: none;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.8);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-btn.playing {
            background: #00ff00;
            box-shadow: 0 5px 20px rgba(0, 255, 0, 0.8);
        }
    </style>
</head>
<body>
    <!-- Senin Kırmızı Butonun -->
    <button id="playPauseBtn" class="play-btn">▶</button>

    <!-- Ses Elementi -->
    <audio id="radioPlayer" crossorigin="anonymous"></audio>

    <script>
        const btn = document.getElementById('playPauseBtn');
        const audio = document.getElementById('radioPlayer');
        let isPlaying = false;

        // Caster.fm'in doğrudan yayın linki (Proxy ile CORS engelini aşıyoruz)
        // Not: Caster.fm panelindeki "Mount Point" ve "Sunucu Adresi" ile birleştirilir.
        // Genelde: http://sunucuadi:port/mountpoint şeklindedir.
        const streamUrl = "https://morcast.caster.fm:12802/d5Rhk";

        // CORS Proxy kullanarak yayını çek (Engelleri aşmak için)
        const proxiedUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(streamUrl)}`;

        btn.addEventListener('click', () => {
            if (!isPlaying) {
                // Yayını yükle ve çal
                audio.src = proxiedUrl;
                audio.load();
                audio.play().then(() => {
                    btn.textContent = '⏸';
                    btn.classList.add('playing');
                    isPlaying = true;
                }).catch(e => {
                    console.error("Hata:", e);
                    alert("Yayın başlatılamadı. Lütfen yayının açık olduğundan emin olun.");
                });
            } else {
                // Durdur
                audio.pause();
                audio.src = ""; // Bağlantıyı kes
                btn.textContent = '▶';
                btn.classList.remove('playing');
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
