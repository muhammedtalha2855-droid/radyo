<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo2855</title>
    <style>
        /* Ekranı tamamen şeffaf yap ve ortala */
        body { 
            background-color: transparent; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Kırmızı Butonun Tasarımı */
        .custom-player {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-btn {
            background: #ff0000;
            color: white;
            border: none;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            font-size: 35px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10; /* Butonu en öne çıkar */
        }

        .play-btn.playing {
            background: #00ff00;
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.6);
        }

        /* Caster.fm Çalarını GİZLE (ama arka planda çalışsın) */
        #hiddenPlayer {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.01; /* Görünmez yap ama tıklanabilir kalsın */
            z-index: 1; 
        }
    </style>
</head>
<body>
    <!-- Gizli Caster.fm Çaları (Arka planda duracak) -->
    <div id="hiddenPlayer">
        <div data-type="newStreamPlayer" 
             data-publicToken="335ce5af-29c4-43b6-a23f-3273782554b3" 
             data-theme="dark" 
             data-color="e81e4d" 
             data-channelId="" 
             data-rendered="false" 
             class="cstrEmbed">
        </div>
        <script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
    </div>

    <!-- Senin Kırmızı Butonun -->
    <div class="custom-player">
        <button id="playPauseBtn" class="play-btn">▶</button>
    </div>

    <script>
        const btn = document.getElementById('playPauseBtn');
        let isPlaying = false;

        // Butona tıklandığında gizli çaları bul ve tıkla
        btn.addEventListener('click', () => {
            // Caster.fm'in gizli iframe'ini bul
            const iframe = document.querySelector('#hiddenPlayer iframe');
            
            if (iframe) {
                // Iframe'in içindeki dokümana eriş
                const innerDoc = iframe.contentDocument || iframe.contentWindow.document;
                
                // Iframe içindeki Play butonunu bul (Caster.fm'in kendi butonu)
                const playBtn = innerDoc.querySelector('button'); 
                
                if (playBtn) {
                    // Tıkla ve görünümü değiştir
                    playBtn.click();
                    isPlaying = !isPlaying;
                    
                    if (isPlaying) {
                        btn.textContent = '⏸';
                        btn.classList.add('playing');
                    } else {
                        btn.textContent = '▶';
                        btn.classList.remove('playing');
                    }
                } else {
                    alert("Yayın henüz hazır değil, lütfen 2 saniye bekleyip tekrar deneyin.");
                }
            } else {
                alert("Bağlantı kuruluyor, lütfen bekleyin...");
            }
        });
    </script>
</body>
</html>
